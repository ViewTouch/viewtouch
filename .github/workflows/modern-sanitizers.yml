# The modern ViewTouch's tests built with AddressSanitizer and
# UndefinedBehaviorSanitizer (memory used after it's freed or past its end,
# leaks, integer overflow, undefined behavior), on every push to main. Slower
# than Modern checks, so apart from them (releases don't wait for it).
name: Modern sanitizers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: modern-sanitizers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanitizers:
    name: Tests under ASan and UBSan (Debian 13, Qt 6.8)
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 150
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git python3 g++ cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools libgl-dev libssl-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-shapes qml6-module-qtquick-dialogs \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qttest \
            libqt6sql6-sqlite qt6-qpa-plugins fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with sanitizers
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S modern -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-O1 \
                -DVTM_SANITIZE=address,undefined
          cmake --build build

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/modern/tools/sanitizers/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1
        run: timeout 8400 ./build/tests/vtm_tests
