# Builds the modern ViewTouch and runs all its tests on every pull request
# and every push to main, on Debian 13 (the Raspberry Pi store computers'
# system) with the Qt ViewTouch carries (modern/tools/qt-version). No
# secrets: it works for pull requests from forks.
name: Modern checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # Modern release: nothing is published that fails them

concurrency:
  group: modern-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Debian 13, Qt 6.12)
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 60
    steps:
      - name: Git (for the checkout)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates git openssl

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # every commit: the build number and version history come from them

      - name: Qt (cached)
        uses: actions/cache@v6
        with:
          path: /opt/qt
          key: qt-${{ hashFiles('modern/tools/qt-version') }}-debian13-x64

      - name: Build tools, fonts and Qt
        run: sh modern/tools/ci-setup.sh

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S modern -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="/opt/qt/$(cat modern/tools/qt-version)"
          cmake --build build

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 2400 ./build/tests/vtm_tests

      - name: Updater
        run: python3 modern/packaging/tests/test_updates.py

      - name: Translations
        run: |
          for lang in es fr pt zh; do
            python3 modern/tools/i18n.py check "$lang"
          done
