# Where store computers look for a new ViewTouch (Home screen -> Updates ->
# Check for a New ViewTouch, and the daily check in Store Check). Packages
# found there must be signed by the key in update-signing-key.pub.pem (or one
# in /etc/viewtouch/trusted-keys/ on the store computer).
#
# A fork that publishes its own packages runs
#   packaging/release-channel.sh OWNER/REPO
# which makes its own signing key and points this file, the key and
# install-viewtouch.sh at its own releases. Leave url empty for no online
# updates. A store computer can use another page: url=https://... in
# /etc/viewtouch/updates.conf.
url=https://github.com/No0ne558/viewtouchFork/releases/download/modern-packages
