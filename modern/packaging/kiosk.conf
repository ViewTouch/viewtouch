# ViewTouch kiosk screen settings (vtmodern-kiosk.service). One
# "option = value" per line; any option from "vtmodern --help" works here
# without the dashes. vtmodern-setup writes the first block for you.
# After a change: sudo systemctl restart vtmodern-kiosk

# --- set by vtmodern-setup ---
# This screen keeps the data and lets other terminals join:
serve = yes
# ...or it joins a store instead (then its own data is not used). "auto"
# finds the store on the network; pair it on its screen with a code from
# Manager -> Terminals -> Pair a Device.
#connect = auto
#terminal = Bar
# --- end ---

# Start on this page instead of the login page (e.g. kitchen for a kitchen
# screen that needs no login).
#page = kitchen

# Backups (only when this screen keeps the data).
#backup-dir = /mnt/usb/viewtouch-backups
#backup-keep = 30
#backup-every = 24

# A second monitor facing the guest: their order, the total, tip choices
# and "thank you". On a kiosk one window spans both monitors; the POS stays
# on the left one.
#customer-display = auto

# The on-screen keyboard for text fields: on unless set here, or turned off
# for this screen in Manager -> Terminals (a screen with a real keyboard).
#touch-keyboard = yes
