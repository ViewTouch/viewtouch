# ViewTouch server settings (vtmodern.service). One "option = value" per
# line; any option from "vtmodern --help" works here without the dashes.
# After a change: sudo systemctl restart vtmodern

# Port the terminals connect to.
#port = 7719

# Only serve on this address (default: all).
#listen = 192.168.1.10

# Backups go to /var/lib/viewtouch/backups unless set here (a USB stick or
# network share is a good choice).
#backup-dir = /mnt/usb/viewtouch-backups
#backup-keep = 30
#backup-every = 24
